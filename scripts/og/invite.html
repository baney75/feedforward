<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: "Plex"; src: url(../../public/fonts/ibm-plex-sans-latin-600-normal.woff2) format("woff2"); font-weight: 600; }
@font-face { font-family: "Plex"; src: url(../../public/fonts/ibm-plex-sans-latin-500-normal.woff2) format("woff2"); font-weight: 500; }
@font-face { font-family: "Plex"; src: url(../../public/fonts/ibm-plex-sans-latin-700-normal.woff2) format("woff2"); font-weight: 700; }
@font-face { font-family: "Plex Mono"; src: url(../../public/fonts/ibm-plex-mono-latin-500-normal.woff2) format("woff2"); font-weight: 500; }
html, body { margin: 0; background: #0e0e0c; }
#c { position: relative; width: 1200px; height: 630px; overflow: hidden; background: #0e0e0c; color: #f3f0e8; font-family: "Plex", system-ui, sans-serif; }
#wall { position: absolute; left: 600px; top: -120px; display: grid; grid-template-columns: repeat(3, 248px); gap: 14px; transform: rotate(-8deg); transform-origin: 0 0; opacity: .9; }
#wall img { width: 248px; height: 140px; object-fit: cover; border-radius: 10px; display: block; }
#fade { position: absolute; inset: 0; background: linear-gradient(90deg, #0e0e0c 46%, rgba(14,14,12,.82) 62%, rgba(14,14,12,.25) 100%); }
.lock { position: absolute; left: 64px; top: 56px; display: flex; gap: 16px; align-items: center; font: 600 40px/1 "Plex"; letter-spacing: -.02em; }
.lock svg { width: 56px; height: 56px; }
.tag { position: absolute; left: 64px; top: 168px; font: 500 22px/1 "Plex Mono"; color: #ffc457; letter-spacing: .04em; text-transform: uppercase; }
h1 { position: absolute; left: 64px; top: 204px; margin: 0; font: 700 100px/.98 "Plex"; letter-spacing: -.035em; width: 520px; }
h1 em { font-style: normal; color: #ffc457; }
p { position: absolute; left: 64px; top: 424px; margin: 0; font: 500 28px/1.35 "Plex"; color: #aaa59b; width: 560px; }
.cta { position: absolute; left: 64px; top: 520px; background: #ffb224; color: #1b1300; font: 600 30px/1 "Plex"; padding: 18px 30px; border-radius: 999px; letter-spacing: -.01em; }
</style></head>
<body><div id="c">
  <div id="wall"></div><div id="fade"></div>
  <div class="lock"><svg viewBox="0 0 64 64"><rect width="64" height="64" rx="15" fill="#ffb224"/><g fill="#1b1300"><rect x="15.5" y="15.7" width="8.2" height="32.6" rx="4.1"/><rect x="27.7" y="21.8" width="8.2" height="20.4" rx="4.1"/><circle cx="44" cy="32" r="4.5"/></g></svg>Feedforward</div>
  <div class="tag">Invite only</div>
  <h1>You're<br><em>invited.</em></h1>
  <p>Learn AI from the people building it. Videos, labs and live sessions.</p>
  <div class="cta">Accept your invite &rarr;</div>
</div>
<script>
fetch("thumbs.json").then((r) => r.json()).then((t) => {
  document.getElementById("wall").innerHTML = t.slice(0, 18).map((x) => `<img src="thumbs/${x.id}.jpg">`).join("");
  return Promise.all([...document.images].map((i) => i.decode().catch(() => {})));
}).then(() => document.fonts.ready).then(() => { window.__ready = true; });
</script>
</body></html>
