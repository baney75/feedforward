# Exceptions to the secret scan. Each entry needs a reason a reviewer can check.
# Match by `path` glob (optionally one `rule`) or by an exact gitleaks `fingerprint`. Never allow a real key:
# rotate it, then add the old one here by fingerprint with the rotation date.

[[allow]]
path = "public/js/pages/agents.js"
rule = "curl-auth-header"
reason = "Setup example on the Connect-an-agent page: the token is the placeholder ffk_your_token, not a credential."

[[allow]]
path = "docs/AGENTS.md"
rule = "curl-auth-header"
reason = "Agent docs curl examples: the token is the placeholder ffk_your_token, not a credential."
