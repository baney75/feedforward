name: Bug report
description: Something on feedforward.dbaney.com or in the code is broken.
title: "Bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. For a security problem, do not use this form. Use the Security tab instead (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Say what you did, what you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open /learn
        2. Tap the tokenizer lab
        3. Type "hello"
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Page address
      placeholder: https://feedforward.dbaney.com/...
  - type: dropdown
    id: where
    attributes:
      label: Where did it happen
      options:
        - The live site
        - A local copy (npm run dev)
        - A local Worker (wrangler dev)
        - The MCP server
        - Not sure
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Device and browser
      description: For example, iPhone 15 with Safari 19, or Windows with Chrome 140.
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or console errors
      description: Drag images in here. Paste any console errors. Do not paste your sign-in code or tokens.
