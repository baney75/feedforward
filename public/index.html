<script>
/* ASCII forward pass: inputs light up layer by layer, then the output fires. Runs before any module loads. */
(function () {
  var caps = ["loading weights", "embedding tokens", "attending", "forward pass", "sampling your feed"];
  var still = matchMedia("(prefers-reduced-motion: reduce)").matches, t = 0;
  function frame(p) {
    var rows = [];
    for (var r = 0; r < 3; r++) {
      var line = " ";
      for (var k = 0; k < 4; k++) line += (k < p ? "<b>@</b>" : "o") + (k < 3 ? (k < p - 1 ? "<b>---</b>" : "---") : "");
      if (r === 1) line += (p >= 5 ? "<b>---&gt; #</b>" : "---&gt;  ");
      rows.push(line);
    }
    return rows.join("\n");
  }
  function tick() {
    var els = document.querySelectorAll(".ascii");
    if (!els.length || document.hidden) return;
    var p = still ? 5 : t % 8, cap = caps[Math.floor(t / 8) % caps.length];
    for (var i = 0; i < els.length; i++) {
      var el = els[i];
      if (!el.firstChild) el.innerHTML = '<pre aria-hidden="true"></pre><span class="ascii-cap"></span>';
      el.firstChild.innerHTML = frame(Math.min(p, 5));
      el.lastChild.textContent = (el.dataset.label || cap) + (still ? "" : ".".repeat(t % 4));
    }
    t++;
  }
  tick(); setInterval(tick, 150);
})();
</script>
