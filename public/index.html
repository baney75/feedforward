  <div class="top-actions">
    <button class="icon-btn only-phone" id="searchBtn" aria-label="Search"></button>

</header>
<nav class="rail" aria-label="Main"></nav>
<main id="view" tabindex="-1"><div class="skel-grid" role="status" aria-label="Loading"><div class="skel-card"><b></b><span><em></em><i></i><i></i></span></div><div class="skel-card"><b></b><span><em></em><i></i><i></i></span></div><div class="skel-card"><b></b><span><em></em><i></i><i></i></span></div><div class="skel-card"><b></b><span><em></em><i></i><i></i></span></div></div></main>
<div id="bar" aria-hidden="true"></div>
<!-- Launch: the tile springs in, the layers fire, the output pops, and the camera dives through it into the
     app. About a second, once per session, never with reduced motion. It plays while the app loads. -->
<div id="launch" aria-hidden="true"><div class="ln-tile"><svg viewBox="0 0 64 64"><rect class="ln-bg" width="64" height="64" rx="15"/><rect class="ln-b1" x="15.5" y="15.7" width="8.2" height="32.6" rx="4.1"/><rect class="ln-b2" x="27.7" y="21.8" width="8.2" height="20.4" rx="4.1"/><circle class="ln-dot" cx="44" cy="32" r="4.5"/></svg></div></div>
<script>
(function () {
  var l = document.getElementById("launch"), seen = false;
  try { seen = sessionStorage.getItem("ff:launched") === "1"; sessionStorage.setItem("ff:launched", "1"); } catch (e) {}
  if (seen || matchMedia("(prefers-reduced-motion: reduce)").matches) { l.remove(); return; }
  l.classList.add("play");
  setTimeout(function () { l.remove(); }, 1250);
})();
</script>
<nav class="tabbar" aria-label="Main"></nav>
<div id="tv" role="dialog" aria-modal="true" aria-label="TV mode" hidden></div>
<dialog id="sheet"></dialog>
<div id="toast" role="status" aria-live="polite"></div>
